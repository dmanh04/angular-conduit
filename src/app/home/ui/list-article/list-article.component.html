@if (listArticleStore.getLoading$ | async) {
  <div class="content">
    <div class="loading-overlay">
      <div class="spinner"></div>
    </div>
  </div>
} @else {
  <div class="list-article">
    <div class="row">
      <div class="col-md-9">
        <app-feed-toggle></app-feed-toggle>
        <app-article
          [listArticle]="this.listArticleStore.getArticles$"
        ></app-article>
        <app-pagination
          [page]="(this.listArticleStore.getPage$ | async)!"
          [size]="(this.listArticleStore.getSize$ | async)!"
          [totalPages]="(this.listArticleStore.getTotalPages$ | async)!"
          [totalElements]="(this.listArticleStore.getTotalElements$ | async)!"
          (changPage)="changePage($event)"
        ></app-pagination>
      </div>
      <div class="col-md-3">
        <app-popular-tag></app-popular-tag>
      </div>
    </div>
  </div>
}
